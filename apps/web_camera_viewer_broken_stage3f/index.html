<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cadscene Web Camera Viewer</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main id="web-camera-viewer" class="viewer-shell">
      <section class="video-pane">
        <video id="video" controls playsinline></video>
        <canvas id="timeline" width="1280" height="86"></canvas>
      </section>
      <section class="side-pane">
        <header>
          <h1>Cadscene Viewer</h1>
          <div id="datasetLabel" class="muted"></div>
        </header>
        <div class="toolbar">
          <button id="prevKeyframe" type="button">上一关键帧</button>
          <button id="nextKeyframe" type="button">下一关键帧</button>
          <label>
            点大小
            <input id="pointSize" type="range" min="1" max="8" value="2" />
          </label>
          <label><input id="togglePoints" type="checkbox" checked /> SfM 点云</label>
          <label><input id="toggleDiagnostics" type="checkbox" checked /> 诊断点</label>
        </div>
        <div id="scene3d"></div>
        <pre id="status"></pre>
      </section>
    </main>
    <script src="./vendor/three.min.js"></script>
    <script src="./vendor/controls/OrbitControls.global.js"></script>
    <script src="./paths.js"></script>
    <script src="./fallback.js"></script>
    <script src="./viewer_legacy.js"></script>
  </body>
</html>

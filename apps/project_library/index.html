<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>项目库 · MediaFlow</title>
  <link rel="icon" href="/apps/workflow_portal/assets/mediaflow-cad-video-logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell" id="appShell">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><img class="brand-logo" src="/apps/workflow_portal/assets/mediaflow-cad-video-logo.svg" alt=""><span class="sidebar-label brand-copy">MediaFlow<small>工作台</small></span></div>
      <nav class="nav-list" aria-label="项目导航">
        <button class="nav-item" data-nav="overview" type="button" aria-current="false" disabled><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></span><span class="sidebar-label">项目概览</span></button>
        <button class="nav-item active" aria-current="page" data-nav="files" type="button"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3.5 7.5h6l2-2h3l2 2h4v11.2a1.8 1.8 0 0 1-1.8 1.8H5.3a1.8 1.8 0 0 1-1.8-1.8Z"/><path d="M3.5 10h17"/></svg></span><span class="sidebar-label">项目文件</span></button>
        <button class="nav-item" data-nav="clips" type="button" aria-current="false" disabled><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 4v16M16 4v16M3 9h5M16 9h5M3 15h5M16 15h5"/></svg></span><span class="sidebar-label">片段管理</span></button>
        <button class="nav-item" data-nav="settings" type="button" aria-current="false" disabled><span class="nav-icon" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2.8v2.1M12 19.1v2.1M2.8 12h2.1M19.1 12h2.1M5.5 5.5 7 7M17 17l1.5 1.5M18.5 5.5 17 7M7 17l-1.5 1.5"/></svg></span><span class="sidebar-label">设置</span></button>
      </nav>
      <button id="sidebarToggle" class="sidebar-toggle" type="button" aria-label="收起侧栏" aria-expanded="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg><span class="sidebar-label">收起侧栏</span></button>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div><p class="eyebrow">本地工作空间</p><h1>项目库</h1><p>打开已有项目，或创建一个新的现场视频项目。</p></div>
        <div class="top-actions">
          <button id="refreshButton" class="icon-button" type="button" aria-label="刷新项目库" title="刷新"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
          <div class="view-switch" role="group" aria-label="项目展示方式">
            <button id="cardViewButton" class="view-button active" type="button" aria-label="卡片展示" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></button>
            <button id="listViewButton" class="view-button" type="button" aria-label="列表展示" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h12M9 12h12M9 18h12"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></svg></button>
          </div>
          <a id="newProjectButton" class="primary-button" href="/apps/workflow_portal/"><span aria-hidden="true">＋</span> 新建项目</a>
        </div>
      </header>

      <div id="liveMessage" class="live-message" role="status" aria-live="polite"></div>
      <section id="projectGrid" class="project-grid" aria-label="项目卡片"></section>
      <section id="projectTable" class="table-panel" aria-label="项目列表" hidden>
        <table><thead><tr><th>项目名称</th><th>视频 / CAD 文件</th><th>片段完成度</th><th>当前状态</th><th>最近更新时间</th></tr></thead><tbody id="projectTableBody"></tbody></table>
      </section>
      <section id="emptyState" class="state-panel" hidden><div class="empty-folder" aria-hidden="true"></div><h2>还没有项目</h2><p>创建第一个项目，上传 MP4 视频和 DXF 图纸开始工作。</p><a class="primary-button" href="/apps/workflow_portal/">新建第一个项目</a></section>
      <section id="errorState" class="state-panel error-state" hidden><h2>项目库暂时无法读取</h2><p id="errorMessage">请检查服务和存储目录后重试。</p><button id="retryButton" class="secondary-button" type="button">重新加载</button></section>
    </main>
  </div>
  <script src="project_library.js"></script>
</body>
</html>

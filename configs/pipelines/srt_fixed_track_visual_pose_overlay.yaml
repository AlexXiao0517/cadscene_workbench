pipeline_name: srt_fixed_track_visual_pose_overlay
version: v1-srt-position-locked

stages:
  alignment:
    enabled: true
    output_subdir: 03_alignment
    inputs:
      trajectory: "${dataset.trajectory_path}"
      web_camera_track: "${dataset.default_track}"
      cad_dir: "${dataset.cad_dir}"
    params:
      cad_scale: "${dataset.cad_scale}"
      origin_xy: "${dataset.origin_xy}"
      fov: 70.0
      fov_from: trajectory
      frontend_track_step: 60
      frame_step: 1

  render:
    enabled: true
    output_subdir: 08_render
    inputs:
      video: "${dataset.video_path}"
      cad_dir: "${dataset.cad_dir}"
      sfm_camera_path: "${run.03_alignment.sfm_camera_path}"
    params:
      cad_scale: "${dataset.cad_scale}"
      origin_xy: "${dataset.origin_xy}"
      debug_scale: 1.0
      overlay_linewidth: 3
      overlay_alpha: 0.88
      faded_overlay: true
      max_distance_m: 900
      fade_start_m: 250

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cadscene-workbench"
version = "0.1.5"
description = "SfM-CAD video registration workbench"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "third_party_licenses/*.txt"]
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "PyYAML>=6.0",
  "Pillow>=10.0",
  "opencv-python>=4.8",
  "ezdxf>=1.1",
  "imageio-ffmpeg>=0.4.9",
  "pycolmap>=0.6",
  "pyproj>=3.6",
  "psutil>=5.9",
]

[project.scripts]
cadscene-workbench = "cadscene.cli.main:main"

[project.optional-dependencies]
sfm = [
  "pycolmap>=0.6",
]
video_analysis = [
  "imageio-ffmpeg>=0.4.9",
  "opencv-python>=4.8",
]
diagnostics = [
  "matplotlib>=3.7",
]
cad = [
  "ezdxf>=1.1",
]
dev = [
  "pytest>=7.4",
  "wheel>=0.41",
]

[tool.setuptools.packages.find]
include = ["cadscene*", "apps", "configs"]

[tool.setuptools.package-data]
apps = [
  "*/*.html",
  "*/*.js",
  "*/*.css",
  "*/*.md",
  "*/assets/*.png",
  "*/assets/*.svg",
  "*/vendor/*.js",
  "*/vendor/controls/*.js",
]
configs = [
  "*/*.yaml",
  "*/*/*.txt",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["project"]

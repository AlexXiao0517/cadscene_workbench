[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cadscene-workbench"
version = "0.1.0"
description = "SfM-CAD video registration workbench"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
]

[project.optional-dependencies]
sfm = [
  "opencv-python>=4.8",
  "pycolmap>=0.6",
]
segmentation = [
  "torch>=2.0",
  "transformers>=4.40",
  "opencv-python>=4.8",
]
video_analysis = [
  "opencv-python>=4.8",
  "imageio-ffmpeg>=0.4.9",
]
diagnostics = [
  "matplotlib>=3.7",
]
cad = [
  "ezdxf>=1.1",
]
dev = [
  "pytest>=7.4",
]

[tool.setuptools.packages.find]
include = ["cadscene*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["project"]
